- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    "~/.tmux.conf": tmux/tmux.conf
    "~/.gitconfig": git/.gitconfig
    "~/.zshrc": zsh/.zshrc
    "~/.zprofile": zsh/.zprofile
    "~/.zshenv": zsh/.zshenv
    "~/.config/zed/keymap.json": zed/keymap.json
    "~/.config/zed/settings.json": zed/settings.json
    "~/.aerospace.toml": ./aerospace.toml
